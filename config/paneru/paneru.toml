# Hyprland's Super is Option here, the key in Super's spot on a PC keyboard, and Hyprland's Alt is Cmd.
# Cmd stays free for app shortcuts such as cmd+t, cmd+f, and cmd+1.
[options]
create_virtual_workspace_automatically = true

[bindings]
window_focus_west = "alt - leftarrow"
window_focus_east = "alt - rightarrow"
window_focus_north = "alt + ctrl - uparrow"
window_focus_south = "alt + ctrl - downarrow"
window_swap_west = "alt + shift - leftarrow"
window_swap_east = "alt + shift - rightarrow"
window_virtual_north = ["alt - uparrow", "alt + shift - tab"]
window_virtual_south = ["alt - downarrow", "alt - tab"]
window_virtualmove_north = "alt + shift - uparrow"
window_virtualmove_south = "alt + shift - downarrow"
window_manage = "alt - t"
window_fullwidth = ["alt - f", "alt + cmd - f"]
window_center = "alt + cmd - u"
window_shrink = "alt - minus"
window_resize = "alt - equal"
window_virtualnum_1 = "alt - 1"
window_virtualmovenum_1 = "alt + shift - 1"
window_virtualsendnum_1 = "alt + shift + cmd - 1"
window_virtualnum_2 = "alt - 2"
window_virtualmovenum_2 = "alt + shift - 2"
window_virtualsendnum_2 = "alt + shift + cmd - 2"
window_virtualnum_3 = "alt - 3"
window_virtualmovenum_3 = "alt + shift - 3"
window_virtualsendnum_3 = "alt + shift + cmd - 3"
window_virtualnum_4 = "alt - 4"
window_virtualmovenum_4 = "alt + shift - 4"
window_virtualsendnum_4 = "alt + shift + cmd - 4"
window_virtualnum_5 = "alt - 5"
window_virtualmovenum_5 = "alt + shift - 5"
window_virtualsendnum_5 = "alt + shift + cmd - 5"
window_virtualnum_6 = "alt - 6"
window_virtualmovenum_6 = "alt + shift - 6"
window_virtualsendnum_6 = "alt + shift + cmd - 6"
window_virtualnum_7 = "alt - 7"
window_virtualmovenum_7 = "alt + shift - 7"
window_virtualsendnum_7 = "alt + shift + cmd - 7"
window_virtualnum_8 = "alt - 8"
window_virtualmovenum_8 = "alt + shift - 8"
window_virtualsendnum_8 = "alt + shift + cmd - 8"
window_virtualnum_9 = "alt - 9"
window_virtualmovenum_9 = "alt + shift - 9"
window_virtualsendnum_9 = "alt + shift + cmd - 9"
window_virtualnum_10 = "alt - 0"
window_virtualmovenum_10 = "alt + shift - 0"
window_virtualsendnum_10 = "alt + shift + cmd - 0"
